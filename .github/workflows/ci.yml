name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  # GitHub ne sait pas restreindre la branche *source* d'une PR : ni les
  # rulesets ni les protections classiques ne raisonnent sur autre chose que la
  # cible. Ce job est donc la seule façon de tenir la règle « on ne promeut
  # qu'en passant par staging », et il ne vaut que déclaré obligatoire.
  #
  # Il tourne sur toutes les PR, pas seulement celles qui visent `main` : un
  # check obligatoire qui ne s'exécute pas reste « en attente » pour toujours,
  # et bloquerait les PR vers `staging`. Il sort donc sans rien dire quand la
  # cible n'est pas `main`.
  #
  # Les deux références passent par l'environnement plutôt que par une
  # interpolation dans le script : un nom de branche est du texte fourni par
  # celui qui ouvre la PR, jamais du shell.
  promotion:
    name: Promouvoir depuis staging
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la branche source
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" != "main" ]; then
            echo "Cible « ${BASE:-aucune} » : rien à vérifier."
            exit 0
          fi

          case "$HEAD" in
            staging | hotfix/*)
              echo "« $HEAD » vers main : promotion légitime."
              ;;
            *)
              echo "::error::« $HEAD » ne peut pas viser main : la production se promeut depuis staging, un correctif urgent depuis une branche hotfix/*."
              exit 1
              ;;
          esac

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest

    # Un vrai Postgres, pas un mock — et la même majeure qu'en local et sur
    # Neon. Un test d'écriture contre un double ne dirait rien des `check`,
    # des clés composites ni des cascades, qui sont la moitié du schéma.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nutrition-calculator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nutrition-calculator"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nutrition-calculator

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `DATABASE_URL` de l'environnement l'emporte sur `.env.test`, qui vise le
      # Postgres local : c'est bien la base jetable ci-dessus qui est migrée.
      - run: npm run db:migrate
      - run: npm test
