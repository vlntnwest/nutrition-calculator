name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest

    # Un vrai Postgres, pas un mock — et la même majeure qu'en local et sur
    # Neon. Un test d'écriture contre un double ne dirait rien des `check`,
    # des clés composites ni des cascades, qui sont la moitié du schéma.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nutrition-calculator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nutrition-calculator"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nutrition-calculator

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `.env.local` n'existe pas ici ; dotenv ne trouve rien et laisse
      # DATABASE_URL de l'environnement faire foi.
      - run: npm run db:migrate
      - run: npm test

  # Rien n'appliquait les migrations en production : `ci.yml` visait un
  # Postgres jetable et le workflow Neon une branche par PR, qui n'est qu'un
  # essai. Elles se jouaient donc à la main, et un oubli ne se voyait qu'au
  # premier plan calculé.
  #
  # `DATABASE_URL` doit être la connexion **directe**, pas le pooler : celui
  # de Neon est en mode transaction et le DDL s'en passe mal, comme pour les
  # branches de preview.
  #
  # Ce job ne précède pas le déploiement Vercel, qui part du même push en
  # parallèle. Une migration compatible avec le code d'avant s'en accommode ;
  # une migration destructive se joue toujours à la main, après.
  migrate:
    name: Migrer la production
    if: github.event_name == 'push'
    needs: [typecheck, lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
